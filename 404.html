<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=https://msp-btr.nl/">
  <meta name="robots" content="noindex">
  <title>BTR Dashboard has moved</title>
  <script>
    // Old bookmarks kept their path, so carry it across instead of dropping
    // everyone on the homepage. /btr-dashboard/page.html becomes
    // https://msp-btr.nl/page.html
    var path = location.pathname.replace(/^\/btr-dashboard\/?/, '/');
    location.replace('https://msp-btr.nl' + path + location.search + location.hash);
  </script>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #001C3D; color: #fff;
      display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; text-align: center; }
    a { color: #fff; }
    p { margin: .5em 0; }
  </style>
</head>
<body>
  <div>
    <p>BTR Dashboard has moved to msp-btr.nl</p>
    <p><a href="https://msp-btr.nl/">Continue to the new site</a></p>
  </div>
</body>
</html>
