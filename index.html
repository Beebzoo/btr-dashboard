<script>
(function () {
    var canvas = document.getElementById('bgCanvas');
    if (!canvas || !canvas.getContext) return;
    var ctx = canvas.getContext('2d');
    var w = 0, h = 0, dpr = 1, particles = [], raf = null;
    var mouse = { x: null, y: null };
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function size() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = canvas.clientWidth;
        h = canvas.clientHeight;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        seed();
    }

    function seed() {
        var count = Math.max(28, Math.min(96, Math.floor(w * h / 17000)));
        particles = [];
        for (var i = 0; i < count; i++) {
            particles.push({
                x: Math.random() * w,
                y: Math.random() * h,
                vx: (Math.random() - 0.5) * 0.35,
                vy: (Math.random() - 0.5) * 0.35,
                r: Math.random() * 1.6 + 0.6
            });
        }
    }

    function frame() {
        ctx.clearRect(0, 0, w, h);
        var i, j, p, a, b, dx, dy, d;
        for (i = 0; i < particles.length; i++) {
            p = particles[i];
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0 || p.x > w) p.vx *= -1;
            if (p.y < 0 || p.y > h) p.vy *= -1;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(150, 215, 240, 0.75)';
            ctx.fill();
        }
        var maxD = 132;
        for (i = 0; i < particles.length; i++) {
            a = particles[i];
            for (j = i + 1; j < particles.length; j++) {
                b = particles[j];
                dx = a.x - b.x; dy = a.y - b.y;
                d = Math.sqrt(dx * dx + dy * dy);
                if (d < maxD) {
                    ctx.strokeStyle = 'rgba(130, 200, 230,' + (1 - d / maxD) * 0.32 + ')';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(a.x, a.y);
                    ctx.lineTo(b.x, b.y);
                    ctx.stroke();
                }
            }
            if (mouse.x !== null) {
                dx = a.x - mouse.x; dy = a.y - mouse.y;
                d = Math.sqrt(dx * dx + dy * dy);
                var mr = 175;
                if (d < mr) {
                    ctx.strokeStyle = 'rgba(0, 205, 230,' + (1 - d / mr) * 0.5 + ')';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(a.x, a.y);
                    ctx.lineTo(mouse.x, mouse.y);
                    ctx.stroke();
                }
            }
        }
        raf = requestAnimationFrame(frame);
    }

    function start() {
        if (raf) { cancelAnimationFrame(raf); raf = null; }
        if (reduce) {
            ctx.clearRect(0, 0, w, h);
            for (var i = 0; i < particles.length; i++) {
                var p = particles[i];
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(150, 215, 240, 0.6)';
                ctx.fill();
            }
            return;
        }
        raf = requestAnimationFrame(frame);
    }

    var resizeTimer;
    window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () { size(); start(); }, 150);
    });
    window.addEventListener('mousemove', function (e) {
        var rect = canvas.getBoundingClientRect();
        mouse.x = e.clientX - rect.left;
        mouse.y = e.clientY - rect.top;
    });
    window.addEventListener('mouseout', function () { mouse.x = null; mouse.y = null; });
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = null; } }
        else { start(); }
    });

    size();
    start();
})();
</script>
